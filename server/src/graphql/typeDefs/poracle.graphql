type PoracleHuman {
  id: ID
  type: String
  name: String
  enabled: Boolean
  area: [String]
  latitude: Float
  longitude: Float
  fails: Int
  last_checked: String
  language: String
  admin_disable: Boolean
  disabled_date: String
  current_profile_no: Int
  community_membership: [String]
  area_restrictions: [String]
  notes: String
  blocked_alerts: [String]
}

type ActiveHour {
  day: Int
  hours: String
  mins: String
  step: Int
  end_hours: Int
  end_mins: Int
  id: ID
}

type PoracleProfile {
  uid: Int
  id: ID
  profile_no: Int
  active_hours: [ActiveHour]
  area: [String]
  latitude: Float
  longitude: Float
  name: String
}

type Poracle {
  status: String
  message: String
  category: String
  human: PoracleHuman
  profile: [PoracleProfile]
  pokemon: [JSON]
  raid: [JSON]
  egg: [JSON]
  quest: [JSON]
  invasion: [JSON]
  incident: [JSON]
  lure: [JSON]
  nest: [JSON]
  gym: [JSON]
}

type PoraclePvpConfig {
  name: String
  cp: Int
  min: Int
}

type PoracleConfig {
  name: String
  templates: JSON
  hasNominatim: Boolean
  addressFormat: String
  locale: String
  everything: String
  prefix: String
  leagues: [PoraclePvpConfig]
  pvp: String
  ui: JSON
  capabilities: JSON
}

type UserPoracleConfig {
  webhooks: [String]
  selected: String
}
